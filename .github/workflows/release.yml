name: DBDock Beta Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            name: linux-amd64
          - os: macos-latest
            platform: darwin/amd64
            name: darwin-amd64
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config build-essential

          # Try installing required WebKit version
          sudo apt-get install -y libwebkit2gtk-4.0-dev || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Fix pkg-config for webkit
        if: runner.os == 'Linux'
        run: |
          if [ ! -f /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc ]; then
            echo "Creating compatibility symlink..."
            sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc \
                      /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          fi

      - name: Install dependencies
        run: |
          go mod tidy
          cd frontend && npm install

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app
        run: wails build -platform ${{ matrix.platform }}

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "build/bin" ]; then
            echo "❌ Build failed: build/bin not found"
            exit 1
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist

          echo "Listing build output:"
          ls -R build/bin || true

          # Linux
          if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then
            cp build/bin/DBDock dist/dbdock-linux-amd64
          fi

          # Windows
          if [[ "${{ matrix.platform }}" == "windows/amd64" ]]; then
            cp build/bin/DBDock.exe dist/dbdock-windows-amd64.exe
          fi

          # macOS (copy the FULL .app bundle)
          if [[ "${{ matrix.platform }}" == "darwin/amd64" ]]; then
            cp -r build/bin/DBDock.app dist/
            zip -r dist/dbdock-darwin-amd64.zip dist/DBDock.app
            rm -rf dist/DBDock.app
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v0.1.0-beta.${{ github.run_number }}+${SHORT_SHA}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: 'Beta Release ${{ steps.version.outputs.VERSION }}'
          prerelease: true
          files: |
            dist/**/*
